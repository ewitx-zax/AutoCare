<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gastos — AutoCare</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/favicon.png">
  <meta name="theme-color" content="#00B4D8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .page-title { font-size: 1.4rem; font-weight: 700; letter-spacing: -.03em; margin-bottom: 20px; }
    .kpi-total-label { font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--txt-muted); margin-bottom: 4px; }
    .kpi-total-val { font-size: 2.2rem; font-weight: 700; letter-spacing: -.04em; font-variant-numeric: tabular-nums; color: var(--ok); }

    /* Gasto por tipo */
    .gasto-row { margin-bottom: 14px; }
    .gasto-head { display: flex; justify-content: space-between; align-items: baseline; font-size: .85rem; font-weight: 600; margin-bottom: 6px; }
    .gasto-monto { color: var(--acc); font-variant-numeric: tabular-nums; }
    .gasto-bar-bg  { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .gasto-bar-fill { height: 100%; background: linear-gradient(90deg, var(--acc), var(--ok)); border-radius: 3px; transition: width .6s ease; }

    /* Bar chart mensual */
    .bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 120px; padding-top: 24px; }
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; }
    .bar-val { font-size: .6rem; color: var(--txt-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .bar-wrap { flex: 1; width: 100%; display: flex; align-items: flex-end; }
    .bar-fill { width: 100%; background: linear-gradient(to top, var(--acc), #00D4FF); border-radius: 4px 4px 0 0; min-height: 4px; }
    .bar-label { font-size: .65rem; color: var(--txt-muted); font-weight: 600; text-transform: uppercase; }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="topbar-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="white"><path d="M5 17H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h14l4 4v4a2 2 0 0 1-2 2h-2M7 17a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM17 17a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>
      </div>
      AutoCare
    </a>
    <span class="topbar-badge" id="alert-badge" style="display:none">0</span>
  </header>

  <main class="page">
    <h1 class="page-title">💳 Gastos</h1>

    <!-- KPI total -->
    <div class="card" style="margin-bottom:16px">
      <div class="kpi-total-label">Total invertido en mantenimiento</div>
      <div class="kpi-total-val" id="gasto-total">$ 0.00</div>
    </div>

    <!-- Por tipo -->
    <div class="card">
      <div class="card-title">Por tipo de servicio</div>
      <div id="gastos-by-tipo"></div>
    </div>

    <!-- Gráfica mensual -->
    <div class="card">
      <div class="card-title">Últimos meses</div>
      <div id="chart-mensual"></div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html"        class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Inicio</a>
    <a href="vehiculo.html"     class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 17H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h14l4 4v4a2 2 0 0 1-2 2h-2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>Vehículo</a>
    <a href="mantenimiento.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>Registro</a>
    <a href="historial.html"    class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.18-7.68"/><line x1="12" y1="7" x2="12" y2="12"/><polyline points="12 12 15 14"/></svg>Historial</a>
    <a href="gastos.html"       class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>Gastos</a>
  </nav>

  <div id="toast-container"></div>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/gastos.js"></script>
</body>
</html>
