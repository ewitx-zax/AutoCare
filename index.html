<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AutoCare</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.png">
  <meta name="theme-color" content="#00B4D8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── Vehicle banner ── */
    .vehicle-banner {
      background: linear-gradient(135deg, #1E2D3D 0%, #162232 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }
    .vehicle-banner::before {
      content: '🚗';
      position: absolute; right: 16px; top: 50%;
      transform: translateY(-50%);
      font-size: 3.5rem; opacity: .12;
    }
    .veh-name { font-size: 1.3rem; font-weight: 700; letter-spacing: -.02em; }
    .veh-year { color: var(--txt-muted); font-weight: 400; }
    .veh-detail { margin-top: 6px; display: flex; align-items: center; gap: 12px; }
    .veh-km { font-size: 0.9rem; color: var(--acc); font-weight: 600; font-variant-numeric: tabular-nums; }
    .veh-placa {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 4px; padding: 2px 8px;
      font-size: 0.75rem; font-weight: 700; letter-spacing: .08em; color: var(--txt-muted);
    }
    .veh-empty { color: var(--txt-muted); font-size: 1rem; }

    /* ── Gauges grid ── */
    .gauges-title {
      font-size: 0.7rem; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--txt-muted); margin-bottom: 12px;
    }
    .gauges-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .gauge-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px 12px;
      display: flex; flex-direction: column; align-items: center;
      text-align: center; transition: border-color .2s;
      cursor: default;
    }
    .gauge-card:hover { border-color: var(--acc); }
    .gauge-arc {
      width: 88px; height: 88px; margin-bottom: 8px;
    }
    .gauge-icon { font-size: 2rem; margin-bottom: 8px; }
    .gauge-label { font-size: 0.75rem; font-weight: 600; color: var(--txt); line-height: 1.3; margin-bottom: 4px; }
    .gauge-km    { font-size: 0.7rem; line-height: 1.4; }
    .gauge-sub   { font-size: 0.65rem; margin-top: 2px; }
    .gauge-add   {
      margin-top: 8px; font-size: 0.72rem; font-weight: 600;
      color: var(--acc); text-decoration: none;
    }
    .gauge-add:hover { text-decoration: underline; }
    .muted { color: var(--txt-muted); }

    /* ── Action buttons ── */
    .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .qa-btn {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 14px 16px;
      text-decoration: none; color: var(--txt); font-size: 0.85rem; font-weight: 600;
      transition: border-color .2s, background .2s;
    }
    .qa-btn:hover { border-color: var(--acc); background: var(--surface2); }
    .qa-btn svg { width: 20px; height: 20px; stroke: var(--acc); flex-shrink: 0; }
    .qa-label { line-height: 1.2; }
    .qa-sub { font-size: .68rem; font-weight: 400; color: var(--txt-muted); }

    /* ── Install / notif ── */
    .util-row { display: flex; gap: 8px; margin-bottom: 16px; }
    #btn-install { display: none; }
  </style>
</head>
<body>

  <!-- Topbar -->
  <header class="topbar">
    <a href="index.html" class="topbar-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M5 17H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h14l4 4v4a2 2 0 0 1-2 2h-2M7 17a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM17 17a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>
      </div>
      AutoCare
    </a>
    <span class="topbar-badge" id="alert-badge" style="display:none">0</span>
  </header>

  <!-- Main -->
  <main class="page">

    <!-- Vehicle Banner -->
    <div class="vehicle-banner" id="vehicle-banner"></div>

    <!-- Quick Actions -->
    <div class="quick-actions">
      <a href="mantenimiento.html" class="qa-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        <div class="qa-label">Registrar<div class="qa-sub">Nuevo mantenimiento</div></div>
      </a>
      <a href="vehiculo.html" class="qa-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
        <div class="qa-label">Mi vehículo<div class="qa-sub">Datos y kilometraje</div></div>
      </a>
    </div>

    <!-- Botones utilitarios -->
    <div class="util-row">
      <button id="btn-install" class="btn btn-secondary" style="font-size:.8rem;padding:9px 14px">
        📲 Instalar app
      </button>
      <button id="btn-notif" class="btn btn-secondary" style="font-size:.8rem;padding:9px 14px">
        🔔 Activar alertas
      </button>
    </div>

    <!-- Gauges -->
    <div class="gauges-title">Estado de mantenimientos</div>
    <div class="gauges-grid" id="gauges-grid"></div>

  </main>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a href="index.html"        class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Inicio</a>
    <a href="vehiculo.html"     class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 17H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h14l4 4v4a2 2 0 0 1-2 2h-2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>Vehículo</a>
    <a href="mantenimiento.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>Registro</a>
    <a href="historial.html"    class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.18-7.68"/><line x1="12" y1="7" x2="12" y2="12"/><polyline points="12 12 15 14"/></svg>Historial</a>
    <a href="gastos.html"       class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>Gastos</a>
  </nav>

  <div id="toast-container"></div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
