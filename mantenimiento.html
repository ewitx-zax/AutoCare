<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Registrar Mantenimiento — AutoCare</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.png">
  <meta name="theme-color" content="#00B4D8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .page-title { font-size: 1.4rem; font-weight: 700; letter-spacing: -.03em; margin-bottom: 20px; }
    select.form-control option { background: #1E2D3D; }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="topbar-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="white"><path d="M5 17H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h14l4 4v4a2 2 0 0 1-2 2h-2M7 17a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM17 17a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>
      </div>
      AutoCare
    </a>
    <span class="topbar-badge" id="alert-badge" style="display:none">0</span>
  </header>

  <main class="page">
    <h1 class="page-title">🔧 Registrar mantenimiento</h1>

    <form id="form-mantenimiento">
      <div class="card">
        <div class="card-title">Tipo de servicio</div>
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label" for="tipo">Servicio realizado</label>
          <select class="form-control" id="tipo" required>
            <option value="">— Seleccionar —</option>
            <option value="aceite">🛢️ Cambio de aceite</option>
            <option value="filtro">🌬️ Filtro de aire</option>
            <option value="llantas">🔄 Rotación de llantas</option>
            <option value="frenos">🛑 Revisión de frenos</option>
            <option value="bateria">🔋 Batería</option>
            <option value="afinacion">⚙️ Afinación</option>
            <option value="general">🔧 Reparación general</option>
          </select>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Detalles del servicio</div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="fecha">Fecha</label>
            <input class="form-control" id="fecha" type="date" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="kilometraje">Kilometraje</label>
            <input class="form-control" id="kilometraje" type="number" min="0" placeholder="km al momento" required
                   style="font-variant-numeric:tabular-nums">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="costo">Costo ($)</label>
            <input class="form-control" id="costo" type="number" min="0" step="0.01" placeholder="0.00">
          </div>
          <div class="form-group">
            <label class="form-label" for="taller">Taller / Lugar</label>
            <input class="form-control" id="taller" type="text" placeholder="Nombre del taller">
          </div>
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label" for="observaciones">Observaciones</label>
          <textarea class="form-control" id="observaciones" placeholder="Notas, repuestos usados, recomendaciones…"></textarea>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><polyline points="20 6 9 17 4 12"/></svg>
        Guardar registro
      </button>
    </form>
  </main>

  <nav class="bottom-nav">
    <a href="index.html"        class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Inicio</a>
    <a href="vehiculo.html"     class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 17H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h14l4 4v4a2 2 0 0 1-2 2h-2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>Vehículo</a>
    <a href="mantenimiento.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>Registro</a>
    <a href="historial.html"    class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.18-7.68"/><line x1="12" y1="7" x2="12" y2="12"/><polyline points="12 12 15 14"/></svg>Historial</a>
    <a href="gastos.html"       class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>Gastos</a>
  </nav>

  <div id="toast-container"></div>
  <script src="storage.js"></script>
  <script src="app.js"></script>
  <script src="mantenimiento.js"></script>
</body>
</html>
